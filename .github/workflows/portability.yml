name: Service portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Build production solver
        run: npm run native:build:linux
      - name: Build native tests with assertions enabled
        run: cmake -S native -B native/build-tests -DCMAKE_BUILD_TYPE=Debug && cmake --build native/build-tests --parallel
      - run: ctest --test-dir native/build-tests --output-on-failure
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:services
