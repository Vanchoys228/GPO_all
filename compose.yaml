services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - bridge
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: docker/bridge.Dockerfile
    environment:
      BRIDGE_BIND_HOST: 0.0.0.0
      TELEMETRY_PORT: 9001
      ROUTE_PORT: 9002
      SOLVER_PORT: 9003
      WEB_STATE_DIR: /state
      SOLVER_PATH: /app/native/build/gpo_route_solver
      MOCK_TELEMETRY: ${MOCK_TELEMETRY:-0}
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9002:9002"
      - "127.0.0.1:9003:9003"
    volumes:
      - ./web_state:/state
    restart: unless-stopped

  webots:
    profiles:
      - simulation
    build:
      context: .
      dockerfile: docker/webots.Dockerfile
    depends_on:
      - bridge
    volumes:
      - ./web_state:/project/web_state
    restart: "no"
